# MediaMTX — jonli video relay (doc.txt §5). Sinovdan o'tgan versiya: v1.20.0.
#
# Nima uchun relay: kamera karyerning ichki tarmog'ida, sayt foydalanuvchisi
# unga to'g'ridan ulana olmaydi. Agent oqimni serverga PUSH qiladi, MediaMTX
# esa uni HLS/WebRTC orqali tarqatadi. Karyer tarmog'ida port ochish yoki oq IP
# kerak emas; saytda 1 kishi ham, 50 kishi ham ko'rsa — karyer kanalidan bitta
# oqim ketadi.
#
# Yo'l nomi: karyer_<karyer_kodi>_<kamera_id> — backend `services/live.py`
# aynan shu ko'rinishda yasaydi (harf/raqamdan boshqa belgilar `_` ga aylanadi).
#
# Bu fayl — **namuna** (parolsiz, git'da kuzatiladi). Prodda uni tahrirlamang:
# keyingi CI `git pull` konflikt berib deploy'ni sindiradi. O'rniga serverda
# parolli nusxa yasang va `.env`da ko'rsating:
#
#   cp mediamtx.yml mediamtx.local.yml      # mediamtx.local.yml git'ga tushmaydi
#   # AGENT_PASSWORD → .env'dagi MEDIAMTX_PUBLISH_PASS bilan bir xil parol
#   echo 'MEDIAMTX_CONFIG=./mediamtx.local.yml' >> .env
#   docker compose -f docker-compose.prod.yml --profile live up -d mediamtx

# Faqat kerakli protokollar: RTSP (agent push) + HLS/WebRTC (sayt).
rtmp: no
srt: no

# ── agent → server ─────────────────────────────────────────────────────────
rtsp: yes
rtspAddress: :8554
# Agent uzilib qolsa oqim tez yopilsin — "o'lik" yo'l ko'rish tomonda
# soatlab qotib turmasin.
readTimeout: 10s
writeTimeout: 10s

# ── server → sayt ──────────────────────────────────────────────────────────
hls: yes
hlsAddress: :8888
hlsVariant: lowLatency
hlsAlwaysRemux: no
# Sayt boshqa domenda (www.raqamli-karyer.uz), oqim esa api.… da — so'rov
# cross-origin bo'ladi. CORS sarlavhasini MediaMTX beradi; nginx'da qayta
# qo'shmang, aks holda ikkita qiymat kelib brauzer rad etadi.
hlsAllowOrigins: ['*']

webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigins: ['*']
# WebRTC media alohida ulanish orqali oqadi (signalizatsiya 8889'da, media
# esa ICE'da). Konteyner ichidagi 172.x manzillar tashqaridan ko'rinmaydi,
# shuning uchun nomzod sifatida ochiq domen e'lon qilinadi. UDP yopiq
# tarmoqlar uchun TCP nomzodi ham yoqilgan — brauzer ishlayotganini tanlaydi.
webrtcAdditionalHosts: [api.raqamli-karyer.uz]
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189

# ── kim nima qila oladi ────────────────────────────────────────────────────
# Ko'rish autentifikatsiyasi qasddan yo'q: HLS/WebRTC portlari faqat
# 127.0.0.1'ga bog'langan, nginx ularni HTTPS ostida uzatadi va havolalarni
# faqat saytga kirgan foydalanuvchi oladi (doc §5.1, §7). Yozish esa —
# faqat agent tokeni bilan.
authInternalUsers:
  - user: agent
    pass: AGENT_PASSWORD
    permissions:
      - action: publish
  - user: any
    permissions:
      - action: read
      - action: playback

paths:
  # Har bir karyer-kamera uchun alohida yo'l; oldindan e'lon qilinmaydi —
  # agent push qilganda paydo bo'ladi.
  '~^karyer_(.+)$':
    source: publisher
