# Production stack — backend + PostGIS on a single VPS.
# Run from the backend/ directory on the server:
#   docker compose -f docker-compose.prod.yml up -d --build
# The backend container runs `alembic upgrade head` before starting uvicorn.
#
# `name:` pins the Compose project so it never collides with another stack on a
# shared host (the default project name is the directory name — here "backend" —
# which clashes with any other .../backend deployment). Host port is configurable
# via BACKEND_PORT (set it in .env when 8000 is taken on the box).
name: karier
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: karier-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-karier}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-karier}
    volumes:
      - karier_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-karier} -d ${POSTGRES_DB:-karier}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: karier-backend:latest
    container_name: karier-backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    # Bound to localhost only — nginx terminates TLS and proxies to it.
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - karier_media:/app/media
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"

  # Jonli video relay (doc.txt §5). Ixtiyoriy: o'chirilgan bo'lsa agent
  # snapshot rejimida ishlaydi, hodisalar oqimi esa umuman ta'sirlanmaydi.
  # Ishga tushirish: docker compose -f docker-compose.prod.yml --profile live up -d
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: karier-mediamtx
    restart: unless-stopped
    profiles: ["live"]
    volumes:
      # Repodagi mediamtx.yml — namuna (parolsiz). Prodda `.env`da
      # MEDIAMTX_CONFIG=./mediamtx.local.yml ko'rsatiladi: shu nusxaga parol
      # yoziladi va u git'ga tushmaydi. Kuzatilayotgan faylni serverda
      # tahrirlash mumkin emas — keyingi CI `git pull` konflikt berib,
      # deploy'ni sindiradi.
      - ${MEDIAMTX_CONFIG:-./mediamtx.yml}:/mediamtx.yml:ro
    ports:
      # RTSP — agent shu portga push qiladi (tashqariga ochiq bo'lishi shart).
      - "8554:8554"
      # HLS/WebRTC signalizatsiyasi — nginx orqali HTTPS ostida uzatiladi,
      # shuning uchun faqat localhost.
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:8889:8889"
      # WebRTC media (ICE) — brauzer bilan to'g'ridan ulanish, nginx orqali
      # o'tmaydi. UDP asosiy yo'l; TCP — UDP yopiq tarmoqlar uchun zaxira.
      - "8189:8189/udp"
      - "8189:8189/tcp"

volumes:
  karier_pgdata:
  karier_media:
